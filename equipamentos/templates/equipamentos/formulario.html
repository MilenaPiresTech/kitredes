{% extends 'equipamentos/base.html' %}

{% block title %}
{{ titulo }}
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-8">

        <div class="card shadow-sm">

            <div class="card-body">

                <h1 class="mb-4">
                    {{ titulo }}
                </h1>

                <form method="POST">

                    {% csrf_token %}

                    {{ form.as_p }}

                    <div class="mt-4">

                        <button type="submit"
                                class="btn btn-primary">
                            Salvar
                        </button>

                        <a href="{% url 'lista_equipamentos' %}"
                           class="btn btn-secondary">
                            Cancelar
                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
